[project]
name = "blastproof-backend"
version = "0.1.0"
description = "Blastproof: a safety gateway for AI agents"
readme = "../README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "mcp==2.3.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "sqlalchemy[asyncio]==2.1.6",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "sqlglot==30.24.0",
    "httpx==0.28.1",
    "langchain==1.4.7",
    "langchain-google-genai==4.4.2",
    "langgraph==1.2.17",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.1",
    "fastembed==0.9.0",
    "langsmith==0.14.12",
    "pyjwt==2.15.1",
    "pwdlib[argon2]==0.3.1",
    "pyyaml==6.0.3",
    "structlog==26.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.2",
    "faker==40.43.0",
]

[tool.uv]
package = false
# CI's setup-uv reads this too, so dev and CI run the same uv (D-073).
required-version = "==0.13.5"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"demo_company".msg = "The backend never imports demo_company/ (CLAUDE.md, D-047)"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "integration: needs the local Docker Compose Postgres (fails, not skips, if it is down)",
]
