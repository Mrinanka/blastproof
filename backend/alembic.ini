# Alembic for Blastproof's own database (backend plan §5, step 4). Run from backend/:
#   uv run alembic upgrade head
# The URL is never in this file: env.py reads BLASTPROOF_MIGRATOR_URL (blastproof_owner).
# Logging is set up by env.py (app.logging, JSON lines), so this file has no logging sections.

[alembic]
script_location = %(here)s/migrations
# So env.py can import `app` whatever the working directory.
prepend_sys_path = %(here)s
path_separator = os
