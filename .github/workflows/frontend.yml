# Frontend CI (frontend plan F1, section 13). Guarded by backend/tests/test_frontend_workflow.py.
# No secrets on purpose: pull-request runs never hold credentials (TEST-01).
name: Frontend

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # OPS-05: the generated types must match backend/openapi.json (the backend's own test
      # checks that file against the routes), so a route change without a regenerate fails here.
      - run: npm run gen:api

      - run: git diff --exit-code src/lib/api/schema.d.ts

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      - run: npm test

      # next/font/google downloads the Geist font here, so the build needs network.
      - run: npm run build
