# Backend CI (backend plan §8 step 2, §15). Guarded by backend/tests/test_ci_workflow.py.
# No secrets on purpose: pull-request runs never hold credentials and never call Neon (TEST-01, TEST-04).
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  NEON_CLIENT: fake

jobs:
  # Fast feedback (D-179): lint and the unit tests, which need no Docker. Plain `pytest` skips the
  # integration tests, so the `integration` job below must always run them.
  unit:
    # Pinned: ubuntu-latest moves to a new release on its own schedule (D-075).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Reads [tool.uv] required-version, so CI and dev run the same uv (D-073).
          version-file: backend/pyproject.toml
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked

      # Includes TID251, the ban on importing demo_company (ARCH-21). demo_company/ has no
      # pyproject.toml, so Ruff lints it with the backend's settings.
      - run: uv run ruff check . ../demo_company ../claude_hook

      - run: uv run ruff format --check . ../demo_company ../claude_hook

      - run: uv run pytest

      # The incident replays must all be caught, by the rules alone: no model, no Docker (EVAL-06,
      # D-045). Exit code 1 on a miss or a scenario that cannot be measured.
      - run: uv run python -m evals.run --mode rules

  # The whole suite (D-179): `--integration` adds the tests that need Postgres. They fail (not
  # skip) if Postgres is down. Guarded by backend/tests/test_ci_workflow.py.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Reads [tool.uv] required-version, so CI and dev run the same uv (D-073).
          version-file: backend/pyproject.toml
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked

      # The same Compose file, image digest and role init scripts as local dev (D-072).
      - run: docker compose up -d --wait
        working-directory: ${{ github.workspace }}

      # Builds company_template (locked) and company_main on the local company-db (step 3).
      # Local target only: CI never talks to Neon.
      - run: uv run --project backend python demo_company/seed.py --target local
        working-directory: ${{ github.workspace }}

      # Blastproof's own schema (step 4), as blastproof_owner. The password is the throwaway local
      # Compose value from docker/blastproof-init/01-roles.sql, not a secret.
      - run: uv run alembic upgrade head
        env:
          BLASTPROOF_MIGRATOR_URL: postgresql://blastproof_owner:blastproof_owner@localhost:5432/blastproof

      # Every test, unit and integration.
      - run: uv run pytest --integration

      - if: failure()
        run: docker compose logs
        working-directory: ${{ github.workspace }}
