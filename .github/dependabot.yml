# Weekly update PRs for every pinned dependency (D-074). Alerts and security updates are turned on in
# the repo settings (SEC-21). CI checks every PR; nothing merges by itself.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      uv:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]

  # The digest-pinned Postgres image in docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      docker-compose:
        patterns: ["*"]
